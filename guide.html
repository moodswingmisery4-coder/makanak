ions.html?destination=desert">کویر مصر</a><a class="bg-slate-100 rounded-xl px-5 py-3 font-bold" href="destinations.html?destination=kish">جزیره کیش</a><a class="bg-slate-100 rounded-xl px-5 py-3 font-bold" href="destinations.html?destination=tehran">اطراف تهران</a></div>`:''}`;document.title=x.t+' | مکانک'</script></body></html>
