<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات اقامتگاه | مکانک</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Vazirmatn','Tahoma']},colors:{ink:'#182338',coral:'#ff5c5c',sand:'#fff8f3'}}}}</script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Vazirmatn,Tahoma,sans-serif;color:#182338}.toast{animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style></head><body class="bg-white"><header class="border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-10"><nav class="max-w-7xl mx-auto px-5 lg:px-8 h-20 flex items-center justify-between"><a href="index.html" class="font-black text-2xl">مکانک<span class="text-coral">.</span></a><a href="index.html#stays" class="text-sm font-bold text-slate-600 hover:text-coral">بازگشت به اقامتگاه‌ها</a></nav></header><main id="detail" class="max-w-7xl mx-auto px-5 lg:px-8 py-10"></main><div id="toast" class="fixed bottom-6 right-6 hidden bg-ink text-white px-5 py-4 rounded-2xl shadow-2xl text-sm"></div><script>const stays=[{type:'villa',name:'ویلای چوبی با چشم‌انداز جنگل',city:'رامسر، مازندران',price:'۳,۸۵۰,۰۰۰',rating:'۴.۹',img:'assets/images/photo-1600607687939-ce8a6c25118c-large.jpg',desc:'اقامتگاهی آرام و دنج با چشم‌انداز سبز جنگل، مناسب سفرهای خانوادگی و آخر هفته.'},{type:'cabin',name:'کلبه دنج مه‌آلود',city:'ماسال، گیلان',price:'۲,۴۵۰,۰۰۰',rating:'۴.۸',img:'assets/images/photo-1510798831971-661eb04b3739-large.jpg',desc:'کلبه‌ای گرم و صمیمی در دل طبیعت ماسال با فضای مناسب برای استراحت.'},{type:'eco',name:'اقامتگاه سنتی نارنجستان',city:'یزد، بافت تاریخی',price:'۱,۷۵۰,۰۰۰',rating:'۴.۷',img:'assets/images/photo-1548013146-72479768bada-large.jpg',desc:'تجربه اقامت در خانه‌ای سنتی و نزدیک به جاذبه‌های تاریخی یزد.'},{type:'villa',name:'خانه ساحلی آبی',city:'رامسر، ساحل دریا',price:'۴,۲۰۰,۰۰۰',rating:'۵.۰',img:'assets/images/photo-1601918774946-25832a4be0d6-large.jpg',desc:'خانه‌ای روشن و آرام در نزدیکی ساحل، مناسب تعطیلات خانوادگی.'}];const i=Number(new URLSearchParams(location.search).get('id'))||0,s=stays[i]||stays[0];document.title=s.name+' | مکانک';document.querySelector('#detail').innerHTML=`<div class="grid lg:grid-cols-2 gap-10 items-start"><div><img src="${s.img}" alt="${s.name}" class="w-full h-[420px] object-cover rounded-[2rem] shadow-lg"><div class="grid grid-cols-3 gap-3 mt-3"><img src="${s.img}" class="h-28 w-full object-cover rounded-2xl"><img src="${s.img}" class="h-28 w-full object-cover rounded-2xl"><img src="${s.img}" class="h-28 w-full object-cover rounded-2xl"></div></div><div><span class="inline-block bg-orange-50 text-coral rounded-full px-4 py-2 text-sm font-bold mb-4">اقامتگاه تایید شده</span><h1 class="text-3xl md:text-4xl font-black leading-relaxed">${s.name}</h1><p class="text-slate-500 mt-2">${s.city} · ★ ${s.rating}</p><p class="text-slate-600 leading-8 mt-8">${s.desc}</p><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 my-8"><div class="bg-slate-50 rounded-2xl p-4 text-center text-sm">🛏️<br><b>۲ اتاق</b></div><div class="bg-slate-50 rounded-2xl p-4 text-center text-sm">👥<br><b>۴ مهمان</b></div><div class="bg-slate-50 rounded-2xl p-4 text-center text-sm">📶<br><b>وای‌فای</b></div><div class="bg-slate-50 rounded-2xl p-4 text-center text-sm">🚗<br><b>پارکینگ</b></div></div><div class="border border-slate-200 rounded-3xl p-6 shadow-sm"><div class="flex items-center justify-between mb-5"><div><b class="text-xl">${s.price} تومان</b><span class="text-slate-400"> / هر شب</span></div><button onclick="favorite()" class="text-2xl text-coral" aria-label="علاقه‌مندی">♡</button></div><button onclick="reserve()" class="w-full bg-coral hover:bg-red-500 text-white rounded-2xl py-4 font-bold">درخواست رزرو</button><p class="text-xs text-slate-400 text-center mt-3">رزرو و پرداخت واقعی در نسخه بعدی فعال می‌شود.</p></div></div></div><section class="mt-16 border-t pt-10"><h2 class="text-2xl font-black mb-4">قوانین اقامتگاه</h2><p class="text-slate-600 leading-8">ساعت ورود از ۱۴ و ساعت خروج تا ۱۲ است. رعایت آرامش همسایه‌ها و قوانین میزبان الزامی است.</p></section>`;function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}function favorite(){let f=JSON.parse(localStorage.getItem('makanak_favorites')||'[]');f=f.includes(i)?f.filter(x=>x!==i):[...f,i];localStorage.setItem('makanak_favorites',JSON.stringify(f));toast(f.includes(i)?'به علاقه‌مندی‌ها اضافه شد':'از علاقه‌مندی‌ها حذف شد')}function reserve(){toast('درخواست رزرو ثبت شد؛ اتصال به پرداخت در نسخه بعدی اضافه می‌شود')}</script></body></html>
