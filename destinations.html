<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقصدهای محبوب | مکانک</title><meta name="description" content="اقامتگاه‌های منتخب در مقصدهای محبوب ایران"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Vazirmatn','Tahoma']},colors:{ink:'#182338',coral:'#ff5c5c',sand:'#fff8f3'}}}}</script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Vazirmatn,Tahoma,sans-serif;color:#182338}.stay-img{height:220px;object-fit:cover}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@media(max-width:640px){.stay-img{height:190px}}</style></head><body class="bg-white"><header class="border-b border-slate-100 sticky top-0 z-10 bg-white/95 backdrop-blur"><nav class="max-w-7xl mx-auto px-5 lg:px-8 h-20 flex items-center justify-between"><a href="index.html" class="font-black text-2xl">مکانک<span class="text-coral">.</span></a><a href="index.html#inspiration" class="text-sm font-bold text-slate-600 hover:text-coral">بازگشت به صفحه اصلی</a></nav></header><main class="max-w-7xl mx-auto px-5 lg:px-8 py-12"><div class="mb-9"><p class="text-coral font-bold text-sm mb-2">برای سفر بعدی</p><h1 class="text-3xl md:text-4xl font-black">اقامتگاه‌های مقصدهای محبوب</h1><p class="text-slate-500 mt-3">از شمال ایران تا کویر و جزیره؛ اقامتگاه مناسب سفرتان را انتخاب کنید.</p></div><div class="flex flex-wrap gap-2 mb-8" id="filters"><button data-filter="all" class="rounded-full bg-ink text-white px-5 py-2.5 text-sm font-bold">همه</button><button data-filter="north" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">شمال ایران</button><button data-filter="desert" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">کویر مصر</button><button data-filter="kish" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">جزیره کیش</button><button data-filter="tehran" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">اطراف تهران</button></div><div id="destinationCards" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div></main><script>const stays=[{id:0,d:'north',name:'ویلای چوبی با چشم‌انداز جنگل',city:'رامسر، مازندران',price:'۳,۸۵۰,۰۰۰',rating:'۴.۹',img:'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80'},{id:1,d:'north',name:'کلبه دنج مه‌آلود',city:'ماسال، گیلان',price:'۲,۴۵۰,۰۰۰',rating:'۴.۸',img:'https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=800&q=80'},{id:2,d:'desert',name:'اقامتگاه سنتی نارنجستان',city:'یزد، بافت تاریخی',price:'۱,۷۵۰,۰۰۰',rating:'۴.۷',img:'https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=800&q=80'},{id:3,d:'kish',name:'خانه ساحلی آبی',city:'رامسر، ساحل دریا',price:'۴,۲۰۰,۰۰۰',rating:'۵.۰',img:'https://images.unsplash.com/photo-1601918774946-25832a4be0d6?auto=format&fit=crop&w=800&q=80'}];const root=document.querySelector('#destinationCards');function render(filter='all'){root.innerHTML=stays.filter(s=>filter==='all'||s.d===filter).map(s=>`<a href="stay.html?id=${s.id}" class="group block"><div class="relative overflow-hidden rounded-2xl"><img class="stay-img w-full group-hover:scale-105 transition duration-500" src="${s.img}" alt="${s.name}" loading="lazy" width="800" height="450" onerror="this.onerror=null;this.src='assets/stay-forest.svg'"><span class="absolute bottom-3 right-3 bg-white/90 text-xs font-bold px-3 py-1.5 rounded-lg">تایید شده</span></div><div class="pt-4"><div class="flex justify-between gap-2"><h2 class="font-bold line-clamp-2 leading-7">${s.name}</h2><span class="text-sm whitespace-nowrap">★ ${s.rating}</span></div><p class="text-sm text-slate-500 mt-1">${s.city}</p><p class="mt-3 text-sm"><b>${s.price} تومان</b> <span class="text-slate-400">/ هر شب</span></p></div></a>`).join('')}document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.className='rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold');b.className='rounded-full bg-ink text-white px-5 py-2.5 text-sm font-bold';render(b.dataset.filter)});render(new URLSearchParams(location.search).get('destination')||'all')</script></body></html>
