<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقصدهای محبوب | مکانک</title><meta name="description" content="اقامتگاه‌های منتخب در مقصدهای محبوب ایران"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Vazirmatn','Tahoma']},colors:{ink:'#182338',coral:'#ff5c5c',sand:'#fff8f3'}}}}</script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Vazirmatn,Tahoma,sans-serif;color:#182338}.stay-img{height:220px;object-fit:cover}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@media(max-width:640px){.stay-img{height:190px}}</style><meta name="theme-color" content="#ffffff"><link rel="stylesheet" href="assets/theme.css"><script src="assets/theme.js"></script></head><body class="bg-white"><header class="border-b border-slate-100 sticky top-0 z-10 bg-white/95 backdrop-blur"><nav class="max-w-7xl mx-auto px-5 lg:px-8 h-20 flex items-center justify-between"><a href="index.html" class="font-black text-2xl">مکانک<span class="text-coral">.</span></a><a href="index.html#inspiration" class="text-sm font-bold text-slate-600 hover:text-coral">بازگشت به صفحه اصلی</a></nav></header><main class="max-w-7xl mx-auto px-5 lg:px-8 py-12"><div class="mb-9"><p class="text-coral font-bold text-sm mb-2">برای سفر بعدی</p><h1 class="text-3xl md:text-4xl font-black">اقامتگاه‌های مقصدهای محبوب</h1><p class="text-slate-500 mt-3">از شمال ایران تا کویر و جزیره؛ اقامتگاه مناسب سفرتان را انتخاب کنید.</p></div><div class="flex flex-wrap gap-2 mb-8" id="filters"><button data-filter="all" class="rounded-full bg-ink text-white px-5 py-2.5 text-sm font-bold">همه</button><button data-filter="north" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">شمال ایران</button><button data-filter="desert" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">کویر مصر</button><button data-filter="kish" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">جزیره کیش</button><button data-filter="tehran" class="rounded-full bg-slate-100 px-5 py-2.5 text-sm font-bold">اطراف تهران</button></div><div id="destinationCards" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div></main><script src="assets/catalog.js"></script><script>
const stays=window.MAKANAK_STAYS,root=document.querySelector('#destinationCards'),params=new URLSearchParams(location.search),city=params.get('city');
const counts=stays.reduce((o,s)=>(o[s.cityName]=(o[s.cityName]||0)+1,o),{});
document.querySelector('#filters').innerHTML='<button data-city="" class="rounded-full bg-slate-100 px-4 py-2">همه ('+stays.length+')</button>'+Object.entries(counts).map(([c,n])=>`<button data-city="${c}" class="rounded-full bg-slate-100 px-4 py-2">${c} (${n})</button>`).join('');
function render(city){const list=stays.filter(s=>!city||s.cityName===city);document.querySelector('h1').textContent=(city||'همه مقصدها')+' · '+list.length+' اقامتگاه در مکانک';root.innerHTML=list.map(s=>`<a href="stay.html?id=${s.id}" class="block"><img src="${s.img}" alt="${s.name}" loading="lazy" class="stay-img w-full rounded-2xl"><h2 class="font-bold mt-3">${s.name}</h2><p class="text-sm text-slate-500">${s.city} · ★ ${s.rating}</p><p class="mt-2">${s.price} تومان / شب</p></a>`).join('')||'<p>هنوز اقامتگاهی برای این مقصد در فهرست مکانک وارد نشده است.</p>'}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>render(b.dataset.city));render(city);
</script></body></html>
